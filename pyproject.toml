[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "trellis-loop"
version = "0.1.0"
description = "Contract-first, gate-enforced development framework — turn best-practices into CI gates."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Subir Roy" }]
keywords = ["ci", "governance", "spec-driven", "quality-gates", "ai-assisted-development", "tdd"]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff"]

[project.scripts]
trellis = "trellis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trellis = ["templates/*.yaml", "templates/*.md", "templates/adapters/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

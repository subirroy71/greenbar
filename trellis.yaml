# Trellis's own policy — Trellis gates itself (dogfood). See contracts/CONTRACT.md.
axes:
  C: [correctness, reasonableness, performance]

tiers:
  trivial:  { gates: [contract] }
  scoped:   { gates: [contract, test] }
  critical: { gates: [contract, test, coverage, review] }

gates:
  contract: { builtin: contract }
  test:     { run: "pytest -q" }
  coverage: { run: "pytest -q --cov=trellis --cov-fail-under=70" }
  review:   { builtin: review }

# Trellis reviews itself: `trellis review --contract contracts/CONTRACT.md`.
# The bundled lens is deterministic (the test suite) so a record is producible with no LLM;
# wire LLM/cross-model lenses (claude / llm / aider) as shown in the template.
review:
  parallelism: 3
  timeout_s: 120
lenses:
  - name: tests
    command: "pytest -q"
    deterministic: true

# Trellis classifies its own changes: docs-only → trivial, big/core → critical, else scoped.
classify:
  default: scoped
  rules:
    - { tier: critical, any_path: ["src/trellis/gates.py", "src/trellis/contract.py"] }
    - { tier: critical, min_files: 15 }
    - { tier: trivial,  only_paths: ["**/*.md", "docs/**", "contracts/**"] }
    - { tier: trivial,  max_files: 1, max_lines: 10 }

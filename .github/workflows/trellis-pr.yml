# Trellis dogfoods its own PR-native flow (editable install, since it's not on PyPI yet).
# The user-facing template is src/trellis/templates/github/trellis-pr.yml (`pip install trellis-loop`).
name: trellis-pr
on: pull_request

permissions:
  contents: read
  pull-requests: write

jobs:
  trellis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -e ".[dev]"

      - name: Resolve contract
        id: c
        run: |
          BASE=${{ github.event.pull_request.base.sha }}
          CONTRACT=$(git diff --name-only "$BASE"...HEAD -- 'contracts/*.md' | head -1)
          [ -z "$CONTRACT" ] && CONTRACT=contracts/CONTRACT.md
          echo "contract=$CONTRACT" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Review
        continue-on-error: true
        run: trellis review --contract "${{ steps.c.outputs.contract }}" --diff-base "${{ steps.c.outputs.base }}" || true

      - name: Gate (required check)
        id: gate
        continue-on-error: true
        run: trellis gate --auto --diff-base "${{ steps.c.outputs.base }}" --contract "${{ steps.c.outputs.contract }}" -v

      - name: Render comment
        run: trellis render --out .trellis/pr-comment.md || true

      - name: Upsert PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- trellis-report -->';
            let body = 'Trellis: no report';
            try { body = fs.readFileSync('.trellis/pr-comment.md', 'utf8'); } catch (e) {}
            const { data: comments } = await github.rest.issues.listComments(
              { ...context.repo, issue_number: context.issue.number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

      - name: Enforce gate result
        if: steps.gate.outcome != 'success'
        run: exit 1

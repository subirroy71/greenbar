name: trellis
on: [push, pull_request]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      # Trellis gates itself: the 'scoped' tier = [contract, test].
      # A bad contract or a failing test exits non-zero and blocks the merge.
      - run: trellis gate scoped --contract contracts/CONTRACT.md -v

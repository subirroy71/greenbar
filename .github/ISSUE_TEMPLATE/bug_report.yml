name: Bug report
description: Something in Greenbar doesn't work as documented.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you run and what went wrong?
      placeholder: "`greenbar gate scoped` exited 0 even though a gate failed…"
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal `greenbar.yaml` / contract + the exact command.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Greenbar version
      placeholder: "greenbar --version"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11"

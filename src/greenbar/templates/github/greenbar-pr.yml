# Greenbar — PR-native check + comment. Copy to .github/workflows/greenbar-pr.yml
# Runs the gate as a REQUIRED check (blocks merge on failure) and upserts ONE PR comment.
# No hosted service — just the repo's GITHUB_TOKEN.
#
# Contract binding: a PR declares its contract with a line in the PR description
#   Greenbar-Contract: contracts/<id>.md
# or by adding/changing exactly one contracts/*.md file. No contract → the contract gate fails
# (it never falls back to some other contract). Tiers without a contract gate — `trivial` in the
# presets — need none, so docs and tiny fixes stay light.
#
# Policy pinning: gates run with the BASE branch's greenbar.yaml, so a PR can't loosen the policy
# that judges it. Protect greenbar.yaml with CODEOWNERS so policy changes get a deliberate review.
#
# Accountability: after merge, the `record` job looks up the merged PR's `greenbar` check and stores
# its result as a git note (refs/notes/greenbar) on the commit that actually landed — durable across
# ephemeral runners, and keyed to the SHA a later `git revert` will name (merge or squash).
# Read it anywhere with `git fetch origin refs/notes/greenbar:refs/notes/greenbar && greenbar accountability`.
name: greenbar-pr
on:
  pull_request:
  push:
    branches: [main]

jobs:
  greenbar:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # to post/update the comment
    env:
      BASE: ${{ github.event.pull_request.base.sha }}
      PR_BODY: ${{ github.event.pull_request.body }}
      GREENBAR_COMMIT: ${{ github.event.pull_request.head.sha }}   # not GitHub's synthetic merge commit
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }          # full history so classify can diff against the base
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install greenbar

      - name: Resolve the PR's contract + the base branch's policy
        id: c
        run: |
          # 1) declared in the PR description
          CONTRACT=$(printf '%s\n' "$PR_BODY" | sed -n 's/^[[:space:]]*Greenbar-Contract:[[:space:]]*\([^[:space:]]*\).*/\1/p' | head -1)
          # 2) else the single contract this PR added/changed
          if [ -z "$CONTRACT" ]; then
            CHANGED=$(git diff --name-only --diff-filter=AM "$BASE"...HEAD -- 'contracts/*.md')
            N=$(printf '%s' "$CHANGED" | grep -c . || true)
            if [ "$N" = "1" ]; then CONTRACT="$CHANGED"
            elif [ "$N" -gt 1 ]; then
              echo "::warning::PR changes $N contracts — declare one with 'Greenbar-Contract: <path>' in the PR description"
            fi
          fi
          if [ -n "$CONTRACT" ] && [ ! -f "$CONTRACT" ]; then
            echo "::warning::declared contract $CONTRACT does not exist"; CONTRACT=""
          fi
          [ -z "$CONTRACT" ] && echo "::notice::no contract bound to this PR — fine for a light (trivial) change; a tier with a contract gate will fail"
          echo "contract=$CONTRACT" >> "$GITHUB_OUTPUT"

          POLICY="$RUNNER_TEMP/greenbar-policy.yaml"
          if git show "$BASE:greenbar.yaml" > "$POLICY" 2>/dev/null; then
            echo "policy: base branch greenbar.yaml"
          else
            cp greenbar.yaml "$POLICY"   # first adoption: the base has no policy yet
            echo "::warning::base branch has no greenbar.yaml — using the PR's (first adoption)"
          fi
          echo "policy=$POLICY" >> "$GITHUB_OUTPUT"

      # Optional: run the review panel here (wire your model CLIs + secrets in greenbar.yaml lenses).
      # The `review` gate verifies the record matches this exact tree, so it must run in this job.
      - name: Review
        continue-on-error: true
        env:
          CONTRACT: ${{ steps.c.outputs.contract }}
          POLICY: ${{ steps.c.outputs.policy }}
        run: |
          [ -n "$CONTRACT" ] && greenbar review --config "$POLICY" --contract "$CONTRACT" --diff-base "$BASE"

      - name: Gate (required check)
        id: gate
        continue-on-error: true            # let the comment post even on failure; we fail at the end
        env:
          CONTRACT: ${{ steps.c.outputs.contract }}
          POLICY: ${{ steps.c.outputs.policy }}
        run: |
          ARGS=()
          [ -n "$CONTRACT" ] && ARGS+=(--contract "$CONTRACT")
          greenbar gate --auto --config "$POLICY" --diff-base "$BASE" "${ARGS[@]}" -v

      - name: Render comment
        run: greenbar render --out .greenbar/pr-comment.md || printf '## 🟩 Greenbar\n_render failed_\n<!-- greenbar-report -->\n' > .greenbar/pr-comment.md

      - name: Upsert PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- greenbar-report -->';
            let body = 'Greenbar: no report';
            try { body = fs.readFileSync('.greenbar/pr-comment.md', 'utf8'); } catch (e) {}
            const { data: comments } = await github.rest.issues.listComments(
              { ...context.repo, issue_number: context.issue.number });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment(
                { ...context.repo, issue_number: context.issue.number, body });
            }

      - name: Enforce gate result
        if: steps.gate.outcome != 'success'
        run: |
          echo "Greenbar gate failed — this check blocks merge."
          exit 1

  record:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write        # to push refs/notes/greenbar
      pull-requests: read    # to find the PR that produced this commit
      checks: read           # to read that PR's greenbar check result
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Record the merged PR's gate result as a git note on the landed commit
        run: |
          git config user.name "greenbar[bot]"
          git config user.email "greenbar-bot@users.noreply.github.com"
          git fetch origin 'refs/notes/greenbar:refs/notes/greenbar' 2>/dev/null || true
          HEAD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].head.sha // ""' 2>/dev/null || true)
          if [ -z "$HEAD_SHA" ]; then
            echo "no PR for $GITHUB_SHA — a direct push is ungoverned; nothing to record"; exit 0
          fi
          CONCLUSION=$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs" \
            --jq '[.check_runs[] | select(.name == "greenbar")][0].conclusion // "missing"')
          OK=false; [ "$CONCLUSION" = "success" ] && OK=true
          EVENT=$(jq -nc --arg c "$GITHUB_SHA" --arg h "$HEAD_SHA" --arg s "$CONCLUSION" --argjson ok "$OK" \
            '{kind: "gate", ok: $ok, commit: $c, pr_head: $h, source: "pr-check", check: $s, gates: []}')
          git notes --ref=greenbar append -m "$EVENT" "$GITHUB_SHA"
          git push origin refs/notes/greenbar

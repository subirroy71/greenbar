# Greenbar project policy — the axis catalog, the blast-radius tier ladder, and the gates.
# This is your project's STANDING policy; a per-change contract declares against it.

# ── Quality-axis catalog ───────────────────────────────────────────────────────
# Which quality axes apply to each "profile". A profile is any dimension of work you review
# along — e.g. C = a code/logic change, D = a data/surface change. Rename/extend freely; the
# contract linter enforces that every axis of every profile a contract declares is accounted for.
axes:
  C: [correctness, reasonableness, performance]     # a code/logic change
  D: [provenance, consistency, correctness, freshness]   # a data / user-facing surface

# ── Tier ladder ────────────────────────────────────────────────────────────────
# Blast-radius tiers: a change declares its tier; the tier fixes which gates are required.
# Cheap changes run little; risky ones run everything. This is how rigor scales to impact.
tiers:
  # `design` runs BEFORE implementation — on the design doc, not the code.
  design:   { gates: [contract, adr, design-review] }
  trivial:  { gates: [contract] }
  scoped:   { gates: [contract, lint, test] }
  critical: { gates: [contract, lint, test, coverage, review] }

# ── Auto blast-radius classification (`greenbar classify` / `greenbar gate --auto`) ──
# First matching rule wins; else `default`. A rule with no conditions never matches.
# Conditions: any_path / only_paths (globs; **=any depth), min_files/max_files, min_lines/max_lines.
classify:
  default: scoped
  rules:
    - { tier: critical, any_path: ["**/migrations/**", "**/auth/**", "**/*secret*", "**/consent*"] }
    - { tier: critical, min_files: 30 }
    - { tier: critical, min_lines: 800 }
    - { tier: trivial,  only_paths: ["**/*.md", "docs/**"] }
    - { tier: trivial,  max_files: 1, max_lines: 10 }

# ── Gates ──────────────────────────────────────────────────────────────────────
# builtin: contract  → Greenbar's own contract validator
# run: "<cmd>"        → any check that exits 0 on pass (swap these for your stack)
# requires_file: <p>  → assert an artifact exists (e.g. a review-panel record)
gates:
  contract:      { builtin: contract }
  lint:          { run: "ruff check ." }
  test:          { run: "pytest -q" }
  coverage:      { run: "pytest -q --cov --cov-fail-under=70" }
  # `builtin: review` requires a FRESH (matches this contract), non-BLOCK review record.
  review:        { builtin: review, fail_on_rubber_stamp: true }
  # Design-phase gates: an ADR must exist + reference this design, and a design-review record
  # (from the design-lens pack) must be present and non-BLOCK.
  adr:           { builtin: adr, dir: "docs/adr", must_reference_contract: true }
  design-review: { builtin: review, record: ".greenbar/design-review.json", fail_on_rubber_stamp: true }

# ── Review panel (`greenbar review`) ──────────────────────────────────────────────
# Each lens is a shell command that receives the prompt (persona + contract + diff) on stdin and
# ends its reply with a JSON verdict: {"verdict":"SIGN|SIGN_WITH_CHANGE|BLOCK","findings":[...]}.
# `deterministic: true` lenses (analyzers) derive the verdict from the exit code instead.
# Cross-model = point different lenses at different model CLIs. A lens that times out / can't be
# parsed is recorded as ERROR (fail-closed) — never a silent SIGN.
review:
  parallelism: 4
  timeout_s: 300
lenses:
  # ── CODE lenses (group: code) — run on the diff via `greenbar review` ──────────────
  - name: static                                   # deterministic: exits 0 on pass (no LLM)
    group: code
    command: "ruff check . && mypy src"    # replace with your analyzers
    deterministic: true
  # - name: correctness                            # LLM lens on model A
  #   group: code
  #   command: "claude -p --model claude-sonnet-5"
  #   persona: "You are a rigorous correctness reviewer. Trace every changed path."
  # - name: security                               # LLM lens on model B (cross-model)
  #   group: code
  #   command: "llm -m gpt-4o"
  #   persona: "You are a security auditor. Hunt auth/secret/injection."

  # ── DESIGN lenses (group: design) — run on the design doc BEFORE code, via
  #    `greenbar review --group design --out .greenbar/design-review.json` ─────────────
  #    Wire each to your model CLI(s); cross-model is encouraged. `persona_file` loads the
  #    discipline rubric from the pack `greenbar init` dropped into ./lenses/.
  # - { name: abstraction, group: design, command: "claude -p", persona_file: "lenses/design.abstraction.md" }
  # - { name: invariants,  group: design, command: "llm -m gpt-4o", persona_file: "lenses/design.invariants.md" }
  # - { name: simplicity,  group: design, command: "claude -p", persona_file: "lenses/design.simplicity.md" }
  # - { name: evolution,   group: design, command: "llm -m gpt-4o", persona_file: "lenses/design.evolution.md" }
  # - { name: domain,      group: design, command: "claude -p", persona_file: "lenses/design.domain.md" }
  # Where a school has a FORMAL tool, prefer running it over a prompt — e.g. a deterministic
  # invariants gate that model-checks a spec:
  # - { name: tla, group: design, deterministic: true, command: "tlc -workers auto spec/Design.tla" }

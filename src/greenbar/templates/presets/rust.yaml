# Greenbar — Rust preset. `greenbar init --preset rust`
axes:
  C: [correctness, reasonableness, performance]
  D: [provenance, consistency, correctness, freshness]
tiers:
  design:   { gates: [contract, adr, design-review] }
  trivial:  { gates: [fmt, test] }         # light mode: no contract for docs / tiny fixes — still checked + tested
  scoped:   { gates: [contract, fmt, lint, test] }
  critical: { gates: [contract, fmt, lint, test, review] }
gates:
  contract:      { builtin: contract }
  fmt:           { run: "cargo fmt --check" }
  lint:          { run: "cargo clippy -- -D warnings" }
  test:          { run: "cargo test" }
  review:        { builtin: review, fail_on_rubber_stamp: true }
  adr:           { builtin: adr, dir: "docs/adr", must_reference_contract: true }
  design-review: { builtin: review, record: ".greenbar/design-review.json", fail_on_rubber_stamp: true }
classify:
  default: scoped
  rules:
    - { tier: critical, any_path: ["**/migrations/**", "**/auth*", "**/*secret*", "**/security/**"] }
    - { tier: critical, min_files: 30 }
    - { tier: scoped,   any_path: ["contracts/**", "**/lenses/**", "CLAUDE.md", "AGENTS.md", ".claude/**", ".cursor/**"] }   # contracts get linted; reviewer + agent instructions are policy
    - { tier: trivial,  only_paths: ["**/*.md", "**/*.rst"] }   # light mode: docs only — any code change needs a contract
review:
  parallelism: 4
  timeout_s: 300
lenses:
  - { name: static, group: code, command: "cargo clippy -- -D warnings", deterministic: true }
  # add LLM/cross-model code + design lenses (see the generic template / lenses/ pack)

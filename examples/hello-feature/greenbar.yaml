# A minimal example project policy.
axes:
  C: [correctness, reasonableness]
tiers:
  trivial: { gates: [test] }   # light mode: no contract for docs / tiny fixes
  scoped:  { gates: [contract, test] }
gates:
  contract: { builtin: contract }
  test:     { run: "echo 'plug your test command here' && true" }

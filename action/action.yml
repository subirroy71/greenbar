name: "Greenbar Gate"
description: "Run a Greenbar tier's gates; fails the job (blocks merge) if any required gate fails."
branding:
  icon: "check-circle"
  color: "green"
inputs:
  tier:
    description: "Tier to run (must be defined in greenbar.yaml)."
    required: true
  contract:
    description: "Path to the contract for the builtin `contract` gate."
    required: false
    default: ""
  version:
    description: "greenbar version to install (default: latest)."
    required: false
    default: ""
runs:
  using: "composite"
  steps:
    - name: Install Greenbar
      shell: bash
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          pip install "greenbar==${{ inputs.version }}"
        else
          pip install greenbar
        fi
    - name: Run gates
      shell: bash
      run: |
        ARGS=()
        [ -n "${{ inputs.contract }}" ] && ARGS+=(--contract "${{ inputs.contract }}")
        greenbar gate "${{ inputs.tier }}" "${ARGS[@]}" -v
